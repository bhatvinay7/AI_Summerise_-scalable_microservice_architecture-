  nats-server:
    image: nats:latest
    container_name: nats-server
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - note-network
    volumes:
      - ./nats_data:/data
      - ./nats-server.conf:/etc/nats/nats-server.conf
    command: ["-c", "/etc/nats/nats-server.conf"]


  http-server:
    image: ${DOCKER_USERNAME}/http-server:latest
    container_name: http-server
    env_file:
      - ./env.compose
    ports:
      - "3001:3001"  
    environment:
      - DATABASE_URL=${DATABASE_URL}  
    networks:
      - note-network
    depends_on:
      - notekafka1
      - notekafka2
      - notekafka3
      - notekafka4
      - nats-server  

  filehandler-server:
    image: ${DOCKER_USERNAME}/filehandler-server:latest
    container_name: filehandler-server
    env_file:
      - ./env.compose
    ports:
      - "3002:3002"   
    networks:
      - note-network
    depends_on:
      - notekafka1
      - notekafka2
      - notekafka3
      - notekafka4
      - nats-server      

  worker-server:
    image: ${DOCKER_USERNAME}/worker-server:latest
    container_name: worker-server
    env_file:
      - ./env.compose
    ports:
      - "3003:3003"   
    networks:
      - note-network
    depends_on:
      - notekafka1
      - notekafka2
      - notekafka3
      - notekafka4
      - nats-server    

  ws-server:
    image: ${DOCKER_USERNAME}/ws-server:latest
    container_name: ws-server
    env_file:
      - ./env.compose
    ports:
      - "8080:8080"   
  
    networks:
      - note-network
    depends_on:
      - notekafka1
      - notekafka2
      - notekafka3
      - notekafka4
      - nats-server
      - worker-server    

  web:
    image: ${DOCKER_USERNAME}/web:latest
    container_name: web
    env_file:
      - ./env.compose
    ports:
      - "3000:3000"   
    networks:
      - note-network

networks:
  note-network:
    driver: bridge

volumes:
  kafka_data1:
  kafka_data2:
  kafka_data3:
  kafka_data4:    

