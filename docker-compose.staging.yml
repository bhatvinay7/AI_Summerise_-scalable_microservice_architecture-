        if [ ! -d '/opt/bitnami/kafka/config/__cluster_metadata-0' ]; then
          echo 'ERROR: Source metadata not found in config directory'
          exit 1
        fi
        
        echo 'Source metadata found, proceeding with copy...'
        
        # Remove existing metadata
