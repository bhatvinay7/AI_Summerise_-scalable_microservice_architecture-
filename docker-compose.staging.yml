        # Verify copy
        if [ -d '/kafka_data2/data__cluster_metadata-0' ]; then
          echo 'SUCCESS: Metadata copied successfully'
          echo 'Contents:'
          ls -la /kafka_data2/data/__cluster_metadata-0
        else
