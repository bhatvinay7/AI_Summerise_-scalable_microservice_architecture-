services:
  http-server:
    build:
      context: .
      dockerfile: apps/http-server/Dockerfile.dev
    container_name: http-server
    ports:
      - "3001:3001"
    volumes:
      - ./apps/http-server:/app/apps/http-server
      - /app/apps/http-server/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true 

    
  filehandler-server:
    build:
      context: .
      dockerfile: apps/filehandler-server/Dockerfile.dev
    container_name: filehandler-server
    ports:
      - "3002:3002"
    volumes:
      - ./apps/filehandler-server:/app/apps/filehandler-server
      - /app/apps/filehandler-server/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true    
  
      
  
  worker-server:
    build:
      context: .
      dockerfile: apps/worker-server/Dockerfile.dev
    container_name: worker-server
    ports:
      - "3003:3003"
    volumes:
      - ./apps/worker-server:/app/apps/worker-server
      - /app/apps/worker-server/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true    
    
  web-frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: web-frontend
    ports:
      - "3000:3000"
    depends_on:
      - http-server
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true  
  ws-server:
    build:
      context: .
      dockerfile: apps/ws-server/Dockerfile.dev
    container_name: ws-server
    ports:
      - "8080:8080"
    depends_on:
      - worker-server
    volumes:
      - ./apps/ws-server:/app/apps/ws-server
      - /app/apps/ws-server/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true  

  kafka1:
    image: bitnami/kafka:4.1.0
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      # KRaft mode
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      - KAFKA_CFG_LISTENERS=INTERNAL://:9092,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka1:9092,EXTERNAL://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER

      # SASL/PLAIN authentication
      - KAFKA_CFG_SASL_ENABLED_MECHANISMS=PLAIN
      - KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL=PLAIN
      - KAFKA_CFG_SECURITY_INTER_BROKER_PROTOCOL=SASL_PLAINTEXT
      - KAFKA_CLIENT_USERS=admin
      - KAFKA_CLIENT_PASSWORDS=admin-secret
      - KAFKA_INTER_BROKER_USER=broker
      - KAFKA_INTER_BROKER_PASSWORD=broker-secret

      # Other configs
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_ENABLE_AUTO_COMMIT=false
      - KAFKA_CFG_LOG_RETENTION_MS=120000   # 2 minutes
      - KAFKA_LOGS_MAX_FILESIZE=10485760    # 10MB rotation (system logs)
      - KAFKA_LOGS_MAX_BACKUPS=2

    volumes:
      - kafka1_data:/bitnami/kafka
    

  kafka2:
    image: bitnami/kafka:4.1.0
    container_name: kafka2
    ports:
      - "9093:9092"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_NODE_ID=2
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      - KAFKA_CFG_LISTENERS=INTERNAL://:9092,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka2:9092,EXTERNAL://localhost:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER

      - KAFKA_CFG_SASL_ENABLED_MECHANISMS=PLAIN
      - KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL=PLAIN
      - KAFKA_CFG_SECURITY_INTER_BROKER_PROTOCOL=SASL_PLAINTEXT
      - KAFKA_CLIENT_USERS=admin
      - KAFKA_CLIENT_PASSWORDS=admin-secret
      - KAFKA_INTER_BROKER_USER=broker
      - KAFKA_INTER_BROKER_PASSWORD=broker-secret

      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_ENABLE_AUTO_COMMIT=false
      - KAFKA_CFG_LOG_RETENTION_MS=120000
      - KAFKA_LOGS_MAX_FILESIZE=10485760
      - KAFKA_LOGS_MAX_BACKUPS=2

    volumes:
      - kafka2_data:/bitnami/kafka
  

  kafka3:
    image: bitnami/kafka:4.1.0
    container_name: kafka3
    ports:
      - "9094:9092"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_NODE_ID=3
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      - KAFKA_CFG_LISTENERS=INTERNAL://:9092,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka3:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER

      - KAFKA_CFG_SASL_ENABLED_MECHANISMS=PLAIN
      - KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL=PLAIN
      - KAFKA_CFG_SECURITY_INTER_BROKER_PROTOCOL=SASL_PLAINTEXT
      - KAFKA_CLIENT_USERS=admin
      - KAFKA_CLIENT_PASSWORDS=admin-secret
      - KAFKA_INTER_BROKER_USER=broker
      - KAFKA_INTER_BROKER_PASSWORD=broker-secret

      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_ENABLE_AUTO_COMMIT=false
      - KAFKA_CFG_LOG_RETENTION_MS=120000
      - KAFKA_LOGS_MAX_FILESIZE=10485760
      - KAFKA_LOGS_MAX_BACKUPS=2

    volumes:
      - kafka3_data:/bitnami/kafka


  natsserver:
    image: nats:latest
    container_name: nats-server
    ports:
      - "4222:4222" # Client port
      - "8222:8222" # HTTP monitoring port
      - "6222:6222" # Clustering port (if needed for multi-node setups)
    volumes:
    - ./nats-server.conf:/etc/nats/nats-server.conf:ro   # mount config
    - ./data:/data/jetstream                            # persistence
    # command: nats-server -c /etc/nats/nats-server.conf 

volumes:
  kafka1_data:
  kafka2_data:
  kafka3_data: