services:
  http-server:
    build:
      context: ./apps/http-server
      dockerfile: Dockerfile.dev
    container_name: http_server
    ports:
      - "3001:3001"
    
  filehandler-service:
    build:
      context: ./apps/filehandler-service
      dockerfile: Dockerfile.dev
    container_name: filehandler_service
    ports:
      - "3002:3002"
  
  workwer-server:
    build:
      context: ./apps/workwer-server
      dockerfile: Dockerfile.dev
    container_name: workwer_server
    ports:
      - "3003:3003"

  prisma:
    build:
      context: ./apps/packages/prisma
      dockerfile: Dockerfile.dev
    container_name: prisma
    ports:
      - "3004:3004"
    
  web-frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: web_frontend
    ports:
      - "3000:3000"
    depends_on:
      - http_server
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true  
  ws_server:
    build:
      context: ./apps/ws-server
      dockerfile: Dockerfile.dev
    container_name: ws_server
    ports:
      - "8080:8080"
    depends_on:
      - reach_backend
    volumes:
      - ./ws-server:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true  

  zookeeper:
    image: bitnami/zookeeper:3.8
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    volumes:
      - zookeeper_data:/bitnami/zookeeper

  kafka1:
    image: bitnami/kafka:3.4
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka1:9092
      - KAFKA_CFG_DELETE_TOPIC_ENABLE=true
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_LOG_RETENTION_MS=1800000
    volumes:
      - kafka1_data:/bitnami/kafka
    depends_on:
      - reach_backend

  kafka2:
    image: bitnami/kafka:3.4
    container_name: kafka2
    ports:
      - "9093:9093"
    environment:
      - KAFKA_BROKER_ID=2
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka2:9093
      - KAFKA_CFG_DELETE_TOPIC_ENABLE=true
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_LOG_RETENTION_MS=1800000
    volumes:
      - kafka2_data:/bitnami/kafka
    depends_on:
      - reach_backend

  kafka3:
    image: bitnami/kafka:3.4
    container_name: kafka3
    ports:
      - "9094:9094"
    environment:
      - KAFKA_BROKER_ID=3
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka3:9094
      - KAFKA_CFG_DELETE_TOPIC_ENABLE=true
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_LOG_RETENTION_MS=1800000
    volumes:
      - kafka3_data:/bitnami/kafka
    depends_on:
      - reach_backend

volumes:
  zookeeper_data:
  kafka1_data:
  kafka2_data:
  kafka3_data: