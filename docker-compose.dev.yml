services:
  http-server:
    build:
      context: .
      dockerfile: apps/http-server/Dockerfile.dev
    container_name: http-server
    ports:
      - "3001:3001"
    volumes:
      - ./apps/http-server:/app/apps/http-server
      - /app/apps/http-server/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true 

    
  filehandler-server:
    build:
      context: .
      dockerfile: apps/filehandler-server/Dockerfile.dev
    container_name: filehandler-server
    ports:
      - "3002:3002"
    volumes:
      - ./apps/filehandler-server:/app/apps/filehandler-server
      - /app/apps/filehandler-server/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true    
  
      
  
  worker-server:
    build:
      context: .
      dockerfile: apps/worker-server/Dockerfile.dev
    container_name: worker-server
    ports:
      - "3003:3003"
    volumes:
      - ./apps/worker-server:/app/apps/worker-server
      - /app/apps/worker-server/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true    
    
  web-frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: web-frontend
    ports:
      - "3000:3000"
    depends_on:
      - http-server
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true  
  ws-server:
    build:
      context: .
      dockerfile: apps/ws-server/Dockerfile.dev
    container_name: ws-server
    ports:
      - "8080:8080"
    depends_on:
      - worker-server
    volumes:
      - ./apps/ws-server:/app/apps/ws-server
      - /app/apps/ws-server/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true  

  zookeeper:
    image: bitnami/zookeeper:3.8
    container_name: notezookeeper
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    volumes:
      - zookeeper_data:/bitnami/zookeeper

  kafka1:
    image: bitnami/kafka:3.4
    container_name: notekafka1
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://notekafka1:9092
      - KAFKA_CFG_DELETE_TOPIC_ENABLE=true
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_CFG_LOG_RETENTION_MS=180000
    volumes:
      - kafka1_data:/bitnami/kafka
    

  kafka2:
    image: bitnami/kafka:3.4
    container_name: notekafka2
    ports:
      - "9093:9093"
    environment:
      - KAFKA_BROKER_ID=2
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://notekafka2:9093
      - KAFKA_CFG_DELETE_TOPIC_ENABLE=true
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_CFG_LOG_RETENTION_MS=180000
    volumes:
      - kafka2_data:/bitnami/kafka
    

  kafka3:
    image: bitnami/kafka:3.4
    container_name: notekafka3
    ports:
      - "9094:9094"
    environment:
      - KAFKA_BROKER_ID=3
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://notekafka3:9094
      - KAFKA_CFG_DELETE_TOPIC_ENABLE=true
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_CFG_LOG_RETENTION_MS=180000
    volumes:
      - kafka3_data:/bitnami/kafka

  natsServer:
    image: nats:latest
    container_name: nats-server
    ports:
      - "4222:4222" # Client port
      - "8222:8222" # HTTP monitoring port
      - "6222:6222" # Clustering port (if needed for multi-node setups)
    volumes:
    - ./nats-server.conf:/etc/nats/nats-server.conf:ro   # mount config
    - ./data:/data/jetstream                            # persistence
    # command: nats-server -c /etc/nats/nats-server.conf 

volumes:
  zookeeper_data:
  kafka1_data:
  kafka2_data:
  kafka3_data: