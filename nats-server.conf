# -------------------------------
# NATS Server Configuration
# -------------------------------

# Give your server a name (useful in clusters/logs)
server_name: "nats-server"

# -------------------------------
# Authentication
# -------------------------------
authorization {
  user: "natsuser"
  password: "natspassword"
  timeout: 2
}
listen:0.0.0.0:4222
# -------------------------------
# Logging
# -------------------------------
debug: true
trace: false
logtime: true
# Uncomment to log to a file instead of stdout
# log_file: "/var/log/nats-server.log"

# -------------------------------
# Limits
# -------------------------------
max_connections: 1000
max_payload: 64MB
write_deadline: "2s"

# -------------------------------
# Monitoring (HTTP on 8222)
# -------------------------------
http: 0.0.0.0:8222

# -------------------------------
# JetStream (Persistence / Streaming)
# -------------------------------
jetstream {
  store_dir: "/data/jetstream"
  max_mem: 512MB
  max_file: 2GB
}

# -------------------------------
# (Optional) Clustering Setup
# Only needed if you run multiple NATS servers
# -------------------------------
# cluster {
#   name: "my-nats-cluster"
#   listen: 0.0.0.0:6222
#   routes = [
#     nats://nats1:6222
#     nats://nats2:6222
#   ]
# }
